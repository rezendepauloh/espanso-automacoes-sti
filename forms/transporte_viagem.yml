# ----------------------------------------------------------------
# FORMULARIO: Transporte para Viagem
# ----------------------------------------------------------------
schema:
  type: object
  properties:
    destino:
      type: array
      title: 'Cidades de destino:'
      items:
        type: string
    data_saida:
      type: string
      format: date
      title: 'Data de saída:'
    hora_saida:
      type: string
      title: 'Horário de saída (ex: 08:00):'
    data_retorno:
      type: string
      format: date
      title: 'Data de retorno:'
    hora_retorno:
      type: string
      title: 'Horário de retorno (ex: 19:00):'
    motivo_viagem:
      type: string
      title: 'Motivo da viagem:'
    demandas:
      type: array
      title: 'Demandas / chamados:'
      items:
        type: string
    passageiros:
      type: array
      title: 'Servidores / terceirizados:'
      items:
        type: string
  required:
    - destino
    - data_saida
    - hora_saida
    - data_retorno
    - hora_retorno
    - motivo_viagem
    - demandas
    - passageiros

uischema:
  type: VerticalLayout
  elements:
    - type: Control
      scope: '#/properties/destino'

    - type: HorizontalLayout
      elements:
        - type: Control
          scope: '#/properties/data_saida'
          options:
            dateFormat: DD/MM/YYYY
            dateSaveFormat: YYYY-MM-DD
        - type: Control
          scope: '#/properties/hora_saida'

    - type: HorizontalLayout
      elements:
        - type: Control
          scope: '#/properties/data_retorno'
          options:
            dateFormat: DD/MM/YYYY
            dateSaveFormat: YYYY-MM-DD
        - type: Control
          scope: '#/properties/hora_retorno'

    - type: Control
      scope: '#/properties/motivo_viagem'
      options:
        multi: true
        rows: 3

    - type: Control
      scope: '#/properties/demandas'

    - type: Control
      scope: '#/properties/passageiros'

data:
  destino:
    - 'Dourados'
    - 'Três Lagoas'
  hora_saida: '08:00'
  hora_retorno: '19:00'
  motivo_viagem: 'Preencher aqui'
  demandas:
    - 'Viagem'
  passageiros:
    - 'Paulo Henrique Gonçalves de Rezende'
    - 'Luiz Leonardo Villalba'
    - 'Reginaldo Bandeira'
    - 'Matheus Rezende de Araújo'
    - 'Marcos Antonio Larréa Barcelos Filho'
    - 'Fernando Montiel Calves'
    - 'Rian Patrick Medeiros Soares'

template: |
  ===FIELD:destino===
  {% for item in destino -%}
  {{ item }}
  {% endfor -%}
  ===FIELD:data_saida===
  {{data_saida}}
  ===FIELD:hora_saida===
  {{hora_saida}}
  ===FIELD:data_retorno===
  {{data_retorno}}
  ===FIELD:hora_retorno===
  {{hora_retorno}}
  ===FIELD:motivo_viagem===
  {{motivo_viagem}}
  ===FIELD:demandas===
  {% for item in demandas -%}
  {{ item }}
  {% endfor -%}
  ===FIELD:passageiros===
  {% for item in passageiros -%}
  {{ item }}
  {% endfor -%}
  ===END===
