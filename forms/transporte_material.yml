# ----------------------------------------------------------------
# FORMULARIO: Transporte de Material (DMP)
# ----------------------------------------------------------------
schema:
  type: object
  properties:
    devolver:
      type: array
      title: "Itens a serem enviados / devolvidos ao DMP:"
      items:
        type: string
  required:
    - devolver

uischema:
  type: VerticalLayout
  elements:
    - type: Control
      scope: "#/properties/devolver"

data:
  devolver:
    - "Computador Dell OptiPlex - Patrimônio: "
    - "Monitor Dell 24\" - Patrimônio: "

template: |
  ===FIELD:devolver===
  {% for item in devolver -%}
  {{ item }}
  {% endfor -%}
  ===END===
