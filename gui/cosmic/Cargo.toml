[package]
name = "sti-forms"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
description = "Interface gráfica nativa COSMIC (Rust + libcosmic) para formulários dinâmicos do Espanso Automações STI"

[lib]
doctest = false

[dependencies]
chrono = "0.4"
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
rev = "be7937d5c2495d002311709d0e68c3f8f845265a"
features = [
    "wgpu",
    "xdg-portal",
]
