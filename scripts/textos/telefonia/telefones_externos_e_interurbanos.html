Para discar para telefones externos, basta discar:
<ul>
<li>De <strong>Campo Grande ou Mato Grosso do Sul</strong>, pode omitir o <strong>DDD 67</strong>:</li>
<ul>
  <li>0 + número</li>
  <li>Exemplo: 0 + 3318-2223</li>
</ul>
<li><strong>Interurbano:</strong></li>
<ul>
  <li>0 + DDD + número</li>
  <li>Exemplo: 0 + 11 + 3318-2223</li>
</ul>
</ul>
<p>Lembrando que vale tanto para celular quanto telefones fixos</p>
