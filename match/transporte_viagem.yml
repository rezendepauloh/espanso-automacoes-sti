matches:
  # ----------------------------------------------------------------
  # SNIPPET: Transporte para Viagem
  # ----------------------------------------------------------------
  - trigger: ":viagem"
    html: |
      {{resposta_viagem}}
    vars:
      - name: resposta_viagem
        type: script
        params:
          args:
            - python
            - "%CONFIG%\\scripts\\python\\transporte_viagem.py"

  # ----------------------------------------------------------------
  # SNIPPET: Transporte para Diária dos Terceirizados
  # ----------------------------------------------------------------
  - trigger: ":diaria"
    html: |
      {{resposta_diaria}}
    vars:
      - name: resposta_diaria
        type: script
        params:
          args:
            - python
            - "%CONFIG%\\scripts\\python\\diaria_viagem.py"
