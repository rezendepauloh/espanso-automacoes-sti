matches:
  # ==============================================================================
  # TEXTOS DE BANCADA (Para Teams dos chamados com os usuários)
  # ==============================================================================
  # --- Texto padrão ---
  - trigger: ':ola'
    html: |
      {{resposta}}
    vars:
      - name: resposta
        type: script
        params:
          args:
            - python
            - "%CONFIG%\\scripts\\python\\dispatcher.py"

  # ==============================================================================
  # TEXTOS DE BANCADA (Para Teams dos chamados com os usuários)
  # ==============================================================================
  - trigger: ':devolu'
    html: |
      {{resposta_devolucao_chamado}}
    vars:
      - name: resposta_devolucao_chamado
        type: script
        params:
          args:
            - python
            - "%CONFIG%\\scripts\\python\\devolucao_chamado.py"
